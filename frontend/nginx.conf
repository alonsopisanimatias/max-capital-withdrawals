server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin from the browser's point of view: it only ever talks to nginx, which forwards
    # to backend-1 inside the docker-compose network. This is why the app needs no CORS config
    # in production (WebConfig's CORS mapping only matters for `npm run dev`) — and why it talks
    # to ONE instance, not both: the multi-instance story (C3) is about background job
    # processing being safe across instances, not about routing user HTTP traffic between them
    # (see DECISIONS.md section 5).
    location /api/ {
        proxy_pass http://backend-1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: any unknown path serves index.html so client-side routing works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx sends no Cache-Control by default, so browsers fall back to their own heuristic
    # caching — which is exactly how a tab kept showing a build from 2 deploys ago even after
    # normal reloads. Split the policy in two: index.html (the only URL that's the SAME on every
    # deploy) must always be revalidated, so the browser notices immediately when it starts
    # pointing at new asset hashes. The hashed files under /assets/ are the opposite case — their
    # content never changes without their filename also changing, so caching them for a long time
    # is completely safe and actually the point of content-hashed filenames.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
